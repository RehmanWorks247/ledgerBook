name: Verify LedgerBook

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ledgerbook_test
          POSTGRES_USER: ledgerbook_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerbook_test -d ledgerbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PUBLIC_APP_URL: http://localhost:5173
      EMAIL_MODE: file
      DATABASE_URL: postgresql://ledgerbook_test:ephemeral-ci-only@127.0.0.1:5432/ledgerbook_test
      TEST_DATABASE_URL: postgresql://ledgerbook_test:ephemeral-ci-only@127.0.0.1:5432/ledgerbook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:migrate
        name: Verify migration replay
      - run: npm run build
      - run: npm test

