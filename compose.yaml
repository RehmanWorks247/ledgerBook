# Local development only. Production must supply its own private database and secrets.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ledgerbook_dev_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    # Concurrent reporting queries exceed Docker's default 64 MB shared memory.
    shm_size: 256mb
    environment:
      POSTGRES_DB: ledgerbook
      POSTGRES_USER: ledgerbook
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledgerbook_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerbook -d ledgerbook"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ledgerbook_dev_redis:
  ledgerbook_dev_postgres:
